name: Run E2E Tests

on: [pull_request]

jobs:
  run-e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        container_name: apisolid
        restart: unless-stopped
        env:
          POSTGRES_USER: apisolid
          POSTGRES_PASSWORD: apisolid
          POSTGRES_DB: api_solid_db
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:e2e
        env:
          JWT_SECRET: testing
          DATABASE_URL: "postgresql://apisolid:apisolid@localhost:5432/api_solid_db?schema=public"